<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>React Assignment</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        height: 100vh;
        background-color: #f4f6f8;
      }

      .sidebar {
        width: 240px;
        background-color: #2c3e50;
        color: #fff;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
      }

      .sidebar h1 {
        font-size: 1.4rem;
        margin-bottom: 20px;
      }

      .nav-links {
        width: 100%;
        list-style: none;
        padding: 0;
      }

      .nav-links li {
        width: 100%;
        text-align: center;
        margin-bottom: 12px;
      }

      .nav-links a {
        display: block;
        padding: 12px;
        color: white;
        text-decoration: none;
        transition: background 0.2s ease;
      }

      .nav-links a:hover {
        background-color: #34495e;
        border-radius: 4px;
      }

      .main-content {
        flex-grow: 1;
        padding: 30px;
        overflow-y: auto;
      }

      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }

        .sidebar {
          width: 100%;
          flex-direction: row;
          justify-content: space-around;
          padding: 10px;
        }

        .sidebar h1 {
          display: none;
        }

        .nav-links {
          display: flex;
          flex-direction: row;
          justify-content: space-around;
          width: 100%;
        }

        .nav-links li {
          margin: 0;
        }

        .nav-links a {
          padding: 10px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="main-content">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
